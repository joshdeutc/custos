appId: com.custos.testnotif
---
# Maestro Flow: Test Notification Simulator UI & Delayed Notification
# Runs on Samsung device to verify simulator controls and background trigger.

- launchApp:
    clearState: false

# 1. Assert UI elements are visible
- assertVisible:
    id: "text_title"
- assertVisible:
    id: "btn_post_now"
- assertVisible:
    id: "btn_post_delayed_5s"
- assertVisible:
    id: "btn_clear"

# 2. Test posting notification immediately from UI
- tapOn:
    id: "btn_post_now"
- assertVisible: "Notifications posted: 1"

# 3. Test clear notifications
- tapOn:
    id: "btn_clear"

# 4. Test delayed notification (triggers after 5 seconds in background)
- tapOn:
    id: "btn_post_delayed_5s"

# Put app into background / HOME while delayed notification is scheduled
- pressKey: Home

# Wait for delayed notification to trigger
- sleep: 6000

# Re-open simulator and verify counter incremented
- launchApp
- assertVisible: "Notifications posted: 2"

# Clean up
- tapOn:
    id: "btn_clear"
