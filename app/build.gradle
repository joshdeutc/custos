plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is loaded from keystore.properties at the repo root. That file (and the
// keystore itself) is git-ignored — it is never published. If it's missing (e.g. someone
// building from source), the release build simply stays unsigned and still compiles.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.jo.selfcontrol.ultimate'
    compileSdk 34

    defaultConfig {
        applicationId "com.jo.selfcontrol.ultimate"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Persistent on-device event log (records foreground-app history) — OFF by default
        // for privacy. The blocking engine never needs it; it exists only for local debugging.
        buildConfigField "boolean", "EVENT_LOG_ENABLED", "false"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
