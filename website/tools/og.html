<!doctype html>
<!-- Source of the 1200x630 Open Graph images. Rendered by render-images.mjs (?lang=fr or ?lang=en). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Custos OG image</title>
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      position: relative;
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 88px;
      box-sizing: border-box;
      background:
        radial-gradient(520px 420px at 1080px 80px, rgb(147 51 234 / 45%), transparent 70%),
        radial-gradient(480px 380px at 120px 620px, rgb(99 102 241 / 35%), transparent 70%),
        #0e0b16;
      color: #f4f1fa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .logo {
      flex: none;
      width: 260px;
      height: 260px;
      filter: drop-shadow(0 24px 48px rgb(147 51 234 / 55%));
    }
    .name {
      margin: 0 0 6px;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #c4b5fd;
    }
    h1 {
      margin: 0 0 28px;
      font-size: 64px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.035em;
    }
    h1 span {
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    ul {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1.5px solid rgb(255 255 255 / 18%);
      background: rgb(255 255 255 / 6%);
      font-size: 24px;
      font-weight: 600;
    }
    .url {
      position: absolute;
      right: 88px;
      bottom: 40px;
      margin: 0;
      font-size: 22px;
      color: #9e95b5;
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
        <stop stop-color="#6366F1"/>
        <stop offset="1" stop-color="#9333EA"/>
      </linearGradient>
    </defs>
    <rect width="108" height="108" rx="24" fill="url(#bg)"/>
    <path d="M44,52 L44,45 A10,10 0 0 1 64,45 L64,52" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M42,51 L66,51 A5,5 0 0 1 71,56 L71,76 A5,5 0 0 1 66,81 L42,81 A5,5 0 0 1 37,76 L37,56 A5,5 0 0 1 42,51 Z" fill="#FFFFFF"/>
    <path d="M54,58 A4,4 0 1 0 54,66 A4,4 0 1 0 54,58 Z" fill="#6D28D9"/>
    <path d="M52,63 L56,63 L55,74 L53,74 Z" fill="#6D28D9"/>
  </svg>
  <div>
    <p class="name">Custos</p>
    <h1 id="title"></h1>
    <ul id="chips"></ul>
  </div>
  <p class="url">github.com/joshdeutc/custos</p>

  <script>
    var copy = {
      fr: {
        title: "Reprends le contrôle de ton <span>temps d’écran</span>.",
        chips: ["Gratuit", "Open source", "100 % local", "Android 8+"]
      },
      en: {
        title: "Take back control of your <span>screen time</span>.",
        chips: ["Free", "Open source", "100% on-device", "Android 8+"]
      }
    };
    var lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr";
    document.documentElement.lang = lang;
    document.getElementById("title").innerHTML = copy[lang].title;
    document.getElementById("chips").innerHTML = copy[lang].chips.map(function (c) {
      return "<li>" + c + "</li>";
    }).join("");
  </script>
</body>
</html>
